services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: personal-expense-hermes
    container_name: expense-hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /Users/iliia.karin/.hermes-expense:/opt/data
      - ../hermes_plugin:/opt/data/plugins/expense:ro
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/secrets/sheets-sa.json:ro
    environment:
      HERMES_HOME: /opt/data
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/sheets-sa.json
      LLAMA_BASE_URL: http://host.docker.internal:8080/v1
      PYTHONPATH: /opt/personal-expense
      HERMES_UID: ${HERMES_UID}
      HERMES_GID: ${HERMES_GID}
